<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>個人履歷城市 | Portfolio City</title>
<style>
  html, body { margin: 0; overflow: hidden; background: #1b3a6b; font-family: "Microsoft JhengHei", sans-serif; }
  #ui-panel {
    position: fixed; top: 0; right: 0; width: 320px; height: 100%;
    background: rgba(20,30,40,0.92); color: #fff; padding: 48px 24px 20px; box-sizing: border-box;
    transform: translateX(100%); transition: transform 0.3s ease; z-index: 10; overflow-y: auto;
  }
  #panel-list { padding-left: 18px; margin: 8px 0 0; font-size: 14px; line-height: 1.6; }
  #panel-list .d { color: #9e9e9e; font-size: 12px; margin-right: 6px; }
  #ui-panel.open { transform: translateX(0); }
  #ui-panel h2 { margin-top: 0; color: #ffd54f; }
  #ui-panel .meta { color: #9e9e9e; font-size: 13px; margin-bottom: 10px; }
  #ui-panel a { color: #4fc3f7; }
  #close-btn { position: absolute; top: 10px; left: 10px; background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
  #hint { position: fixed; bottom: 10px; left: 10px; color: #cfd8dc; font-size: 13px; background: rgba(0,0,0,0.4); padding: 6px 12px; border-radius: 6px; }
  #title { position: fixed; top: 12px; width: 100%; text-align: center; color: #fff; font-size: 30px; font-weight: bold; text-shadow: 0 2px 6px #1b3a6b; pointer-events: none; }
  #tip { position: fixed; pointer-events: none; background: rgba(0,0,0,0.7); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; display: none; }
  body.embed #title, body.embed #hint { display: none; }
</style>
</head>
<body>
  <div id="title">🏙️ 個人履歷城市</div>
  <div id="tip"></div>
  <div id="ui-panel">
    <button id="close-btn">✕</button>
    <h2 id="panel-title"></h2>
    <div class="meta" id="panel-meta"></div>
    <p id="panel-desc"></p>
    <ul id="panel-list"></ul>
    <a id="panel-link" href="#" target="_blank" style="display:none;">前往查看 →</a>
  </div>
  <div id="hint">🖱️ 左鍵旋轉 ・ 滾輪縮放 ・ 右鍵平移 ・ 點擊建築查看內容</div>
<script type="module" src="src/main3d.js"></script>
</body>
</html>
