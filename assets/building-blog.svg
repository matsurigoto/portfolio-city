<svg xmlns="http://www.w3.org/2000/svg" width="140" height="150" viewBox="0 0 140 150">
  <defs>
    <linearGradient id="wallBlog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a1887f"/>
      <stop offset="100%" stop-color="#6d4c41"/>
    </linearGradient>
    <linearGradient id="roofBlog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef5350"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="70" cy="140" rx="48" ry="9" fill="#000" opacity="0.18"/>
  <!-- main wall -->
  <rect x="25" y="68" width="90" height="62" rx="4" fill="url(#wallBlog)"/>
  <!-- door -->
  <rect x="60" y="100" width="20" height="30" rx="2" fill="#4e342e"/>
  <!-- windows -->
  <rect x="35" y="82" width="16" height="16" rx="2" fill="#fff3e0" opacity="0.9"/>
  <rect x="89" y="82" width="16" height="16" rx="2" fill="#fff3e0" opacity="0.9"/>
  <!-- roof -->
  <polygon points="15,70 70,20 125,70" fill="url(#roofBlog)"/>
  <polygon points="15,70 70,20 70,30 25,70" fill="#ffffff" opacity="0.12"/>
  <!-- chimney -->
  <rect x="95" y="34" width="10" height="24" fill="#8d6e63"/>
  <!-- sign: open book icon above door -->
  <g transform="translate(60,88)">
    <rect x="0" y="4" width="20" height="3" rx="1.5" fill="#ffd54f"/>
    <rect x="0" y="9" width="20" height="3" rx="1.5" fill="#ffd54f"/>
  </g>
</svg>
