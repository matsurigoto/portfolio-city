  <path d="M52 20 a23 23 0 0 1 46 0" stroke="#ffccbc" stroke-width="3" fill="none" opacity="0.5"/>
  <!-- side windows -->
  <rect x="40" y="148" width="14" height="14" rx="2" fill="#ffebee" opacity="0.9"/>
  <rect x="96" y="148" width="14" height="14" rx="2" fill="#ffebee" opacity="0.9"/>
